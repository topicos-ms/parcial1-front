<div class="launcher-container">
  <div class="launcher-content">

    <div class="brand-section">
      <div class="brand-logo">
        <mat-icon class="brand-icon">school</mat-icon>
      </div>
      <h1 class="brand-title">Sistema Académico</h1>
      <p class="brand-subtitle">Gestión Universitaria</p>
    </div>

    <div class="auth-tabs">
      <mat-tab-group 
        [selectedIndex]="selectedIndex()" 
        (selectedIndexChange)="selectedIndex.set($event)"
        animationDuration="300ms"
      >
        <mat-tab label="Iniciar Sesión">
          <app-login (switchToRegister)="switchToRegister()"></app-login>
        </mat-tab>
        
        <mat-tab label="Registrarse">
          <app-register (switchToLogin)="switchToLogin()"></app-register>
        </mat-tab>
      </mat-tab-group>
    </div>
  </div>

  <div class="background-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>
</div>
